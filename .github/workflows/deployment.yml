name: Deployment

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  QT_VERSION: 6.8.1

jobs:
  # ──────────────────────────────────────────────────────────────────────
  #  Build and package the installed tree, one archive per platform
  # ──────────────────────────────────────────────────────────────────────
  build:
    name: "Package (${{ matrix.alias }})"

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            alias: Linux-x64
            cmake_preset: Linux
            shell_ext: .sh
            vcpkg_triplet: x64-linux

          - os: macos-latest
            alias: macOS-arm64
            cmake_preset: Darwin
            shell_ext: .sh
            vcpkg_triplet: arm64-osx

          - os: windows-latest
            alias: Windows-x64
            cmake_preset: Windows
            shell_ext: .bat
            vcpkg_triplet: x64-windows

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout vcpkg
        uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: 2026.07.29
          path: vcpkg
          # Shallow, deliberately. vcpkg only needs the port trees present
          # at this ref, which is true so long as nothing in vcpkg.json
          # overrides a port to a version the baseline does not carry --
          # that is what sends vcpkg into the registry's history and makes
          # a 285 MB full clone a build requirement.

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Windows was the one platform left to find Ninja on its own, on the
      # assumption that the MSVC dev environment exposes the copy bundled
      # with Visual Studio. Installed explicitly instead, so all three
      # platforms get it the same way and the generator does not depend on
      # what a runner image happens to ship.
      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ''
          cache: true

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          .\bootstrap-vcpkg${{ matrix.shell_ext }}
          .\vcpkg.exe integrate install

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.VCPKG_ROOT }}
        run: |
          ./bootstrap-vcpkg${{ matrix.shell_ext }}
          chmod +x vcpkg

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Put Qt on PATH for later steps (Windows)
        # vcvars64, which msvc-dev-cmd runs, REPLACES PATH rather than
        # extending it, and forwards the replacement to every later step --
        # so the Qt bin directory install-qt-action added is gone by the
        # time anything runs. Every test executable then fails to load
        # Qt6Core.dll, and on a non-interactive runner that is not an error,
        # it is a process that never returns: all seven suites time out at
        # 60s having never started. The original PATH survives in
        # __VSCMD_PREINIT_PATH, but Qt's own directory is the only part
        # needed here.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:QT_ROOT_DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Re-pin VCPKG_ROOT (Windows)
        # See unit_testing.yml: vcvars64 overrides VCPKG_ROOT with Visual
        # Studio's bundled copy for every later step.
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "VCPKG_ROOT=${{ github.workspace }}\vcpkg" >> $env:GITHUB_ENV

      - name: Configure
        # Tests off for a release build: what ships is the library, its
        # headers and the package config. The suites run in unit_testing.
        run: >
          cmake --preset=${{ matrix.cmake_preset }} -B build-release
          -DHYDROCOUPLEOGC_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-release --config Release

      - name: Install to a staging prefix
        # An ABSOLUTE prefix. A relative one is taken against the build
        # directory, which puts the tree somewhere no later step looks.
        run: >
          cmake --install build-release --config Release
          --prefix "${{ github.workspace }}/stage/HydroCoupleOgc"

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/HydroCoupleOgc-${{ matrix.alias }}.tar.gz" \
              -C "${{ github.workspace }}/stage" HydroCoupleOgc

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "${{ github.workspace }}\stage\HydroCoupleOgc" `
                           -DestinationPath "dist\HydroCoupleOgc-${{ matrix.alias }}.zip"

      - name: Upload package artifact
        uses: actions/upload-artifact@v5
        with:
          name: HydroCoupleOgc-${{ matrix.alias }}
          path: dist/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────
  #  Create GitHub Release
  # ──────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*
